# The server behind a reverse proxy that terminates TLS, as an example of
# TLS_MODE=behind-proxy.
#
# Before the first run the proxy needs two things in ./certs:
#   retune-ca.crt        the CA that issued device certificates, from
#                        `retune-server ca cert` on a server that has one
#   proxy.crt, proxy.key the certificate agents will see
#
# Agents reach the proxy, not the server. The server listens on plain HTTP and
# is never published outside this network.
name: retune-proxy

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: retune
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retune}
      POSTGRES_DB: retune
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retune -d retune"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ${RETUNE_IMAGE:-ghcr.io/ssan9876/retune-server:latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      DATABASE_URL: postgres://retune:${POSTGRES_PASSWORD:-retune}@db:5432/retune?sslmode=disable
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost:8443}
      DATA_DIR: /var/lib/retune
      TLS_MODE: behind-proxy
      CLIENT_CERT_HEADER: X-Forwarded-Client-Cert
      # Only the proxy may assert a device certificate. Anything else reaching
      # the server directly and carrying that header is refused outright.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.0.0/16}
      AGENT_API_LISTEN: :8080
      AGENT_RELEASE_KEYS: ${AGENT_RELEASE_KEYS:-}
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      RELEASE_FEED_URL: ${RELEASE_FEED_URL:-}
    volumes:
      - ca:/var/lib/retune
      - updater-run:/run/retune-updater
    # The updater waits for this before calling an update done.
    healthcheck:
      test: ["CMD", "/retune-server", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:1.27
    ports:
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - server
    restart: unless-stopped

  # Optional: updates the server when an administrator clicks Update in the
  # console. It is the only container with the Docker socket. Start it with
  # `docker compose --profile updater up -d`; it needs UPDATER_TOKEN and
  # AGENT_RELEASE_KEYS in .env. See "Updating the server" in the README.
  updater:
    image: ${RETUNE_UPDATER_IMAGE:-ghcr.io/ssan9876/retune-updater:latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.updater
    profiles: ["updater"]
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      AGENT_RELEASE_KEYS: ${AGENT_RELEASE_KEYS:-}
      RELEASE_FEED_URL: ${RELEASE_FEED_URL:-}
      POSTGRES_USER: retune
      POSTGRES_DB: retune
      UPDATER_PROJECT_DIR: /project
      UPDATER_BACKUPS_KEEP: ${UPDATER_BACKUPS_KEEP:-5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # This directory: the Compose file and the .env the updater pins the
      # new image in.
      - ./:/project
      - updater-run:/run/retune-updater
      - updater-state:/var/lib/retune-updater
      # Database dumps taken before every update.
      - backups:/backups
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # Fixed so TRUSTED_PROXIES can name it.
        - subnet: 172.30.0.0/16

volumes:
  db:
  ca:
  updater-run:
  updater-state:
  backups:
