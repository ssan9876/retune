name: retune

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: retune
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retune}
      POSTGRES_DB: retune
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retune -d retune"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    # A release's image, pinned by digest in .env by the updater. Building
    # from source instead: docker compose build server
    image: ${RETUNE_IMAGE:-ghcr.io/ssan9876/retune-server:latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      DATABASE_URL: postgres://retune:${POSTGRES_PASSWORD:-retune}@db:5432/retune?sslmode=disable
      # The address agents will use to reach this server.
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost:8443}
      DATA_DIR: /var/lib/retune
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-300}
      AGENT_RELEASE_KEYS: ${AGENT_RELEASE_KEYS:-}
      OPERATIONS_KEYS: ${OPERATIONS_KEYS:-}
      APPROVALS_REQUIRED: ${APPROVALS_REQUIRED:-}
      APPROVAL_DEVICE_THRESHOLD: ${APPROVAL_DEVICE_THRESHOLD:-}
      # Mail relay for alert email; see the README's settings table.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-}
      # Unset leaves /metrics off.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Single sign-on; see the README. Unset leaves it off.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
      OIDC_ADMIN_GROUPS: ${OIDC_ADMIN_GROUPS:-}
      OIDC_HELPDESK_GROUPS: ${OIDC_HELPDESK_GROUPS:-}
      OIDC_READONLY_GROUPS: ${OIDC_READONLY_GROUPS:-}
      OIDC_SCOPE_GROUPS: ${OIDC_SCOPE_GROUPS:-}
      OIDC_FLEET_GROUPS: ${OIDC_FLEET_GROUPS:-}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-}
      OIDC_DISABLE_LOCAL_LOGIN: ${OIDC_DISABLE_LOCAL_LOGIN:-}
      # Unset takes the default horizon; 0 keeps that history forever.
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      COMMAND_RETENTION_DAYS: ${COMMAND_RETENTION_DAYS:-}
      SCRIPT_RUN_RETENTION_DAYS: ${SCRIPT_RUN_RETENTION_DAYS:-}
      APP_INSTALL_RETENTION_DAYS: ${APP_INSTALL_RETENTION_DAYS:-}
      AUDIT_SYSLOG_ADDRESS: ${AUDIT_SYSLOG_ADDRESS:-}
      AUDIT_WEBHOOK_URL: ${AUDIT_WEBHOOK_URL:-}
      AUDIT_WEBHOOK_HEADER: ${AUDIT_WEBHOOK_HEADER:-}
      # Shared with the updater service; unset, the console offers no Update.
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      RELEASE_FEED_URL: ${RELEASE_FEED_URL:-}
    ports:
      - "8443:8443"
    volumes:
      # Holds the internal CA. Losing it orphans every enrolled device.
      - ca:/var/lib/retune
      # Where the updater's socket appears, when it runs.
      - updater-run:/run/retune-updater
    # The image is distroless, so the probe is the server binary asking its
    # own /readyz - there is no shell or curl in here to call.
    healthcheck:
      test: ["CMD", "/retune-server", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Migrations run at startup, so the first check must not arrive before
      # the schema is in place on a cold database.
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Optional: updates the server when an administrator clicks Update in the
  # console. It is the only container with the Docker socket. Start it with
  # `docker compose --profile updater up -d`; it needs UPDATER_TOKEN and
  # AGENT_RELEASE_KEYS in .env. See "Updating the server" in the README.
  updater:
    image: ${RETUNE_UPDATER_IMAGE:-ghcr.io/ssan9876/retune-updater:latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.updater
    profiles: ["updater"]
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      AGENT_RELEASE_KEYS: ${AGENT_RELEASE_KEYS:-}
      RELEASE_FEED_URL: ${RELEASE_FEED_URL:-}
      POSTGRES_USER: retune
      POSTGRES_DB: retune
      UPDATER_PROJECT_DIR: /project
      UPDATER_BACKUPS_KEEP: ${UPDATER_BACKUPS_KEEP:-5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # This directory: the Compose file and the .env the updater pins the
      # new image in.
      - ./:/project
      - updater-run:/run/retune-updater
      - updater-state:/var/lib/retune-updater
      # Database dumps taken before every update.
      - backups:/backups
    restart: unless-stopped

volumes:
  db:
  ca:
  updater-run:
  updater-state:
  backups:
