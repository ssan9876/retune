name: retune

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: retune
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retune}
      POSTGRES_DB: retune
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retune -d retune"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      DATABASE_URL: postgres://retune:${POSTGRES_PASSWORD:-retune}@db:5432/retune?sslmode=disable
      # The address agents will use to reach this server.
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost:8443}
      DATA_DIR: /var/lib/retune
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-300}
      AGENT_RELEASE_KEYS: ${AGENT_RELEASE_KEYS:-}
    ports:
      - "8443:8443"
    volumes:
      # Holds the internal CA. Losing it orphans every enrolled device.
      - ca:/var/lib/retune
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db:
  ca:
