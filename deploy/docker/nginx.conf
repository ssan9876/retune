# An example reverse proxy in front of retune-server, for TLS_MODE=behind-proxy.
#
# nginx terminates TLS, performs the mutual-TLS handshake with agents, and
# forwards each device's certificate in a header. The server verifies that
# certificate against its own CA: the proxy delivers the bytes, it does not get
# to vouch for them.

events {}

http {
    # Agents that have not enrolled yet have no certificate, so verification is
    # optional here. The server refuses any request that needs one and does not
    # carry one.
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/proxy.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.key;

        # The CA that issued the device certificates, from `retune-server ca cert`.
        ssl_client_certificate /etc/nginx/certs/retune-ca.crt;
        ssl_verify_client      optional;

        client_max_body_size 8m;

        location / {
            proxy_pass http://server:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # The device certificate, URL-encoded. This is the header
            # client_cert_header names.
            proxy_set_header X-Forwarded-Client-Cert $ssl_client_escaped_cert;
        }
    }
}
