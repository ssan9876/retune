name: Release

# Pushing a tag vX.Y.Z builds, signs and publishes a release: the agent for
# Windows (MSI), macOS (pkg) and Linux, the server and retune-sign binaries,
# SHA256SUMS, and the server image on ghcr.io.
#
# A pull request that touches the release machinery runs the same builds as a
# dry run, with a throwaway signing key, and publishes nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "deploy/**"
      - "cmd/retune-sign/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Work out the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
              exit 1
            fi
            release=true
          else
            version=0.0.${GITHUB_RUN_NUMBER}-dryrun
            release=false
          fi
          case $version in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version $version (release: $release, prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

      # Fail before anything is built, not after.
      - name: Check the release key
        if: steps.version.outputs.release == 'true'
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo "::error::The RELEASE_KEY secret is not set. Refusing to publish unsigned agents."
            exit 1
          fi

      # A dry run signs with a key made for this run and thrown away after it,
      # so the signing path is exercised without the real key.
      - name: Make a throwaway key
        if: steps.version.outputs.release != 'true'
        run: go run ./cmd/retune-sign keygen --out "$RUNNER_TEMP/dryrun-key"

      - name: Keep the throwaway key for the build jobs
        if: steps.version.outputs.release != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dryrun-key
          path: ${{ runner.temp }}/dryrun-key/release.key
          retention-days: 1

  linux:
    name: Linux — agent, server and tools
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE: ${{ needs.prepare.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/download-artifact@v7
        if: env.RELEASE != 'true'
        with:
          name: dryrun-key
          path: ${{ runner.temp }}/dryrun-key

      - name: Load the signing key
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          RELEASE_PUBKEYS: ${{ vars.RELEASE_PUBKEYS }}
        run: bash deploy/release/signing-key.sh

      # The server embeds the console.
      - name: Build the console
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Build
        env:
          OPERATIONS_KEYS: ${{ needs.prepare.outputs.release == 'true' && vars.OPERATIONS_PUBKEYS || '' }}
        run: |
          mkdir -p dist
          agent_flags="-X retune/internal/agent/facts.AgentVersion=$VERSION -X retune/internal/agent/facts.TrustedKeysRaw=$TRUSTED_KEYS -X retune/internal/agent/facts.OperationsKeysRaw=$OPERATIONS_KEYS"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$agent_flags" \
              -o "dist/retune-agent-linux-$arch" ./cmd/retune-agent
            go run ./cmd/retune-sign sign --key env:RELEASE_KEY --version "$VERSION" "dist/retune-agent-linux-$arch"
          done
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "dist/retune-server-$os-$arch$ext" ./cmd/retune-server
          done
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "dist/retune-sign-$os-$arch$ext" ./cmd/retune-sign
          done
          cp deploy/linux/retune-agent.service deploy/macos/retune-agent.plist.example dist/
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/*

  windows:
    name: Windows — agent MSI
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE: ${{ needs.prepare.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/download-artifact@v7
        if: env.RELEASE != 'true'
        with:
          name: dryrun-key
          path: ${{ runner.temp }}/dryrun-key

      - name: Load the signing key
        shell: bash
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          RELEASE_PUBKEYS: ${{ vars.RELEASE_PUBKEYS }}
        run: bash deploy/release/signing-key.sh

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Add the WiX Util extension
        run: wix extension add --global WixToolset.Util.wixext/5.0.2

      - name: Build the agent and its MSI
        env:
          OPERATIONS_KEYS: ${{ needs.prepare.outputs.release == 'true' && vars.OPERATIONS_PUBKEYS || '' }}
        run: pwsh deploy/msi/build.ps1 -Version $env:VERSION -ReleaseKey env:RELEASE_KEY -TrustedKeys $env:TRUSTED_KEYS -OperationsKeys $env:OPERATIONS_KEYS

      # Authenticode signs the MSI only. The agent inside keeps the bytes its
      # release signature covers; signing the exe would change them.
      - name: Sign the MSI (Authenticode)
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX) {
            "> [!WARNING]`n> The MSI is not Authenticode-signed (no WINDOWS_CERT_PFX secret): a double-click install shows a SmartScreen warning. Intune, GPO and msiexec /qn are unaffected." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Retune Agent" bin\retune-agent.msi
          $code = $LASTEXITCODE
          Remove-Item $pfx -Force
          if ($code -ne 0) { throw "signtool failed" }

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            bin/retune-agent.msi
            bin/retune-agent.exe
            bin/retune-agent.exe.sig

  macos:
    name: macOS — agent pkg
    needs: prepare
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE: ${{ needs.prepare.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/download-artifact@v7
        if: env.RELEASE != 'true'
        with:
          name: dryrun-key
          path: ${{ runner.temp }}/dryrun-key

      - name: Load the signing key
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          RELEASE_PUBKEYS: ${{ vars.RELEASE_PUBKEYS }}
        run: bash deploy/release/signing-key.sh

      - name: Build the agent
        env:
          OPERATIONS_KEYS: ${{ needs.prepare.outputs.release == 'true' && vars.OPERATIONS_PUBKEYS || '' }}
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-X retune/internal/agent/facts.AgentVersion=$VERSION -X retune/internal/agent/facts.TrustedKeysRaw=$TRUSTED_KEYS -X retune/internal/agent/facts.OperationsKeysRaw=$OPERATIONS_KEYS" \
              -o "dist/retune-agent-darwin-$arch" ./cmd/retune-agent
          done
          lipo -create -output dist/retune-agent-darwin-universal dist/retune-agent-darwin-arm64 dist/retune-agent-darwin-amd64

      # Optional: with a Developer ID the binaries are code-signed and the pkg
      # signed and notarized. Without one they are not, and the summary says so.
      - name: Import the Apple signing identities
        id: apple
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            printf '> [!WARNING]\n> The macOS agent and pkg are not signed or notarized (no MACOS_CERT_P12 secret): Gatekeeper refuses a double-click install. MDM and `sudo installer -pkg` are unaffected.\n' >> "$GITHUB_STEP_SUMMARY"
            echo "signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kc="$RUNNER_TEMP/build.keychain-db"
          kcpw=$(uuidgen)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "signing=true" >> "$GITHUB_OUTPUT"

      # Code signing changes a binary's bytes, so it comes before the release
      # signature, never after.
      - name: Code-sign the agent
        if: steps.apple.outputs.signing == 'true'
        env:
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
        run: |
          for f in dist/retune-agent-darwin-*; do
            codesign --force --options runtime --timestamp --identifier com.retune.agent -s "$MACOS_APP_IDENTITY" "$f"
          done

      - name: Release-sign the agent
        run: |
          for f in dist/retune-agent-darwin-arm64 dist/retune-agent-darwin-amd64 dist/retune-agent-darwin-universal; do
            go run ./cmd/retune-sign sign --key env:RELEASE_KEY --version "$VERSION" "$f"
          done

      - name: Build the pkg
        env:
          MACOS_INSTALLER_IDENTITY: ${{ steps.apple.outputs.signing == 'true' && secrets.MACOS_INSTALLER_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          sh deploy/macos/build-pkg.sh "$VERSION" dist/retune-agent-darwin-universal dist/retune-agent.pkg
          pkgutil --payload-files dist/retune-agent.pkg

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/*

  image:
    name: Server image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # The image's digest goes into release.json, so a server that updates
    # itself pulls exactly what was signed, not whatever a tag points at now.
    outputs:
      image: ${{ steps.build.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE: ${{ needs.prepare.outputs.release }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      # Both platforms cross-compile in the build stages and the final stage
      # runs nothing, so no emulation is needed.
      - name: Build (and on a release, push) the image
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/retune-server
          tags="-t $image:$VERSION"
          [ "$PRERELEASE" = false ] && tags="$tags -t $image:latest"
          docker buildx create --use --name release
          meta="$RUNNER_TEMP/image-metadata.json"
          if [ "$RELEASE" = true ]; then
            printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker buildx build --platform linux/amd64,linux/arm64 -f deploy/docker/Dockerfile $tags --metadata-file "$meta" --push .
            echo "Pushed $image:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            docker buildx build --platform linux/amd64,linux/arm64 -f deploy/docker/Dockerfile $tags --metadata-file "$meta" .
            echo "Built $image:$VERSION for amd64 and arm64 (dry run: not pushed)" >> "$GITHUB_STEP_SUMMARY"
          fi
          digest=$(jq -r '."containerimage.digest" // empty' "$meta")
          if [ -z "$digest" ] && [ "$RELEASE" = true ]; then
            echo "::error::buildx reported no digest for the pushed image"
            exit 1
          fi
          # An image built but not pushed may have no registry digest; the dry
          # run only needs something well-formed to put in release.json.
          if [ -z "$digest" ]; then
            digest=$(jq -r '."containerimage.config.digest" // empty' "$meta")
          fi
          [ -z "$digest" ] && digest="sha256:$(printf '0%.0s' $(seq 64))"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Image digest: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: [prepare, linux, windows, macos, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE: ${{ needs.prepare.outputs.release }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v7
        if: env.RELEASE != 'true'
        with:
          name: dryrun-key
          path: ${{ runner.temp }}/dryrun-key

      - name: Load the signing key
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          RELEASE_PUBKEYS: ${{ vars.RELEASE_PUBKEYS }}
        run: bash deploy/release/signing-key.sh

      # Every agent build must verify under the key the release is signed
      # with, whichever runner built it, before anything is published.
      - name: Verify the agent signatures
        run: |
          count=0
          for sig in dist/*.sig; do
            go run ./cmd/retune-sign verify --trust "$RELEASE_PUB" "${sig%.sig}" "$sig"
            count=$((count + 1))
          done
          [ "$count" -eq 6 ] || { echo "::error::expected 6 signed agent builds, found $count"; exit 1; }

      - name: Checksums
        run: |
          cd dist
          sha256sum * | tee ../SHA256SUMS
          mv ../SHA256SUMS .

      - name: Release notes
        run: |
          tag=v$VERSION
          prev=""
          if [ "$RELEASE" = true ]; then
            prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          else
            tag=HEAD
            prev=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          fi
          {
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s (%h)' "$prev..$tag"
            else
              git log --no-merges --pretty='- %s (%h)' -n 50 "$tag"
            fi
            echo
            echo "## Install"
            echo
            echo "- **Windows:** \`msiexec /i retune-agent.msi SERVER_URL=https://mdm.example.com ENROLL_TOKEN=<token> /qn\`"
            echo "- **macOS:** \`retune-agent.pkg\`, with the settings in \`retune-agent.plist\` beside it or pushed by your MDM (see \`retune-agent.plist.example\`)."
            echo "- **Linux:** \`retune-agent-linux-amd64\` or \`-arm64\` to \`/usr/local/bin/retune-agent\`, then \`retune-agent enroll\` and \`retune-agent.service\`."
            echo "- **Server:** \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/retune-server:$VERSION\`, or \`retune-server-linux-amd64\`."
            echo
            echo "Agent builds are signed with the release key \`$RELEASE_PUB\`: set it in \`AGENT_RELEASE_KEYS\` to upload them for self-update. Check downloads against \`SHA256SUMS\`."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      # release.json lists every file with its hash, and the server image by
      # digest, signed with the release key. It is what a server's release
      # feed reads: nothing in a release is trusted except through it.
      - name: Signed release manifest
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          flags=""
          [ "$PRERELEASE" = true ] && flags="--prerelease"
          go run ./cmd/retune-sign release-manifest --version "$VERSION" $flags \
            --notes "$RUNNER_TEMP/notes.md" --image "$IMAGE" --image-digest "$IMAGE_DIGEST" \
            --out dist/release.json dist/*
          go run ./cmd/retune-sign sign-release --key env:RELEASE_KEY dist/release.json
          go run ./cmd/retune-sign verify-release --trust "$RELEASE_PUB" dist/release.json dist/release.json.sig

      - name: Publish the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          [ "$PRERELEASE" = true ] && flags="--prerelease"
          gh release create "v$VERSION" dist/* --verify-tag --title "Retune $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" $flags

      - name: Keep the dry run's files
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-release
          path: dist/*
          retention-days: 7
