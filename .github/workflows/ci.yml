name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # Linux is split three ways so nothing waits on anything else: the Go suite
  # (whose database tests share one throwaway Postgres per package through
  # testcontainers), the console's own tests, and the builds.
  go-test:
    name: Linux — Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      # The database tests pull Postgres and testcontainers' reaper from Docker
      # Hub, which now and then drops a connection. Pull them first, with
      # retries, so one dropped pull does not fail a whole package.
      - name: Pull the test images
        run: |
          ryuk=$(grep -rhoE 'testcontainers/ryuk:[0-9.]+' "$(go list -m -f '{{.Dir}}' github.com/testcontainers/testcontainers-go)" --include=*.go | head -1)
          for image in postgres:17-alpine "$ryuk"; do
            for try in 1 2 3 4 5; do
              docker pull -q "$image" && break
              [ "$try" = 5 ] && exit 1
              sleep $((try * 5))
            done
          done

      # The server embeds the console build, so the tests run against one.
      - name: Build the console
        run: npm --prefix web ci && npm --prefix web run build

      # The race detector runs here and only here: it needs CGO, which the Windows job does not have.
      - name: Test
        run: go test -race ./...

  console:
    name: Linux — console tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install console dependencies
        run: npm --prefix web ci

      - name: Test the console
        run: npm --prefix web run test

      - name: Build the console
        run: npm --prefix web run build

  build:
    name: Linux — vet and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      # The Go binary embeds this build.
      - name: Build the console
        run: npm --prefix web ci && npm --prefix web run build

      - name: Vet
        run: go vet ./...

      # A throwaway key per run: CI artefacts are for tests, not release, but
      # the signing path itself is exercised every time.
      - name: Make a throwaway release key
        run: go run ./cmd/retune-sign keygen --out "$RUNNER_TEMP/release"

      - name: Build the binaries
        run: |
          PUB=$(cat "$RUNNER_TEMP/release/release.pub")
          go build -ldflags "-X retune/internal/agent/facts.AgentVersion=0.1.${{ github.run_number }} -X retune/internal/agent/facts.TrustedKeysRaw=$PUB" -o bin/ ./cmd/...
          go run ./cmd/retune-sign sign --key "$RUNNER_TEMP/release/release.key" --version 0.1.${{ github.run_number }} bin/retune-agent
          go run ./cmd/retune-sign verify --trust "$PUB" bin/retune-agent bin/retune-agent.sig

      - uses: actions/upload-artifact@v7
        with:
          name: retune-agent-linux
          path: |
            bin/retune-agent
            bin/retune-agent.sig

      # Builds the console and the binary the same way a deployment does.
      - name: Build the server image
        run: docker build -f deploy/docker/Dockerfile -t retune-server:ci .

  # The console in a real browser against a real server: test/console starts
  # Postgres through testcontainers, seeds simulated agents and serves the
  # console build; Playwright drives Chromium through it.
  console-e2e:
    name: Linux â€” console in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      # The database tests pull Postgres and testcontainers' reaper from Docker
      # Hub, which now and then drops a connection. Pull them first, with
      # retries, so one dropped pull does not fail a whole package.
      - name: Pull the test images
        run: |
          ryuk=$(grep -rhoE 'testcontainers/ryuk:[0-9.]+' "$(go list -m -f '{{.Dir}}' github.com/testcontainers/testcontainers-go)" --include=*.go | head -1)
          for image in postgres:17-alpine "$ryuk"; do
            for try in 1 2 3 4 5; do
              docker pull -q "$image" && break
              [ "$try" = 5 ] && exit 1
              sleep $((try * 5))
            done
          done

      - name: Install console dependencies
        run: npm --prefix web ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # The server embeds this build.
      - name: Build the console
        run: npm --prefix web run build

      - name: Build the test server
        run: go build -o /dev/null ./test/console

      - name: Browser tests
        run: npm --prefix web run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/e2e/.state/report
            web/e2e/.state/results
          retention-days: 14

  # macOS covers the Mac agent: its inventory collector, script runner and
  # launchd daemon. The server is not built here; the Linux job covers it.
  macos:
    name: macOS â€” agent tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./internal/agent/... ./internal/protocol/ ./cmd/retune-agent/

      - name: Test
        run: go test -short ./internal/agent/... ./internal/protocol/ ./cmd/retune-agent/

      # Inventory from the runner itself: every tool the collector reads must
      # exist and parse on a real Mac.
      - name: Collect inventory
        run: go test -run TestCollectOnMac -v ./internal/agent/inventory/

  # Windows covers the agent code that only exists there: DPAPI, the WMI and
  # registry inventory collector, and running PowerShell. Docker on Windows
  # runners cannot start Linux containers, so -short skips the Postgres tests
  # the Linux job already ran.
  windows:
    name: Windows â€” agent tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Test without the database
        run: go test -short ./...

      - name: Make a throwaway release key
        run: go run ./cmd/retune-sign keygen --out "$env:RUNNER_TEMP\release"

      - name: Build the binaries
        run: go build -ldflags "-X retune/internal/agent/facts.AgentVersion=0.1.${{ github.run_number }}" -o bin/ ./cmd/...

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Add the WiX Util extension
        run: wix extension add --global WixToolset.Util.wixext/5.0.2

      # The MSI is unsigned (Authenticode), but the agent inside it is signed
      # with the run's throwaway release key.
      - name: Build the agent MSI
        run: |
          $pub = (Get-Content "$env:RUNNER_TEMP\release\release.pub").Trim()
          pwsh deploy/msi/build.ps1 -Version 0.1.${{ github.run_number }} -ReleaseKey "$env:RUNNER_TEMP\release\release.key" -TrustedKeys $pub

      # The build and its signature travel together: Agent versions takes both,
      # and a signature without the exact bytes it signed verifies nothing.
      - uses: actions/upload-artifact@v7
        with:
          name: retune-agent-windows
          path: |
            bin/retune-agent.msi
            bin/retune-agent.exe
            bin/retune-agent.exe.sig
